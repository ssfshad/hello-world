name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    # Windows first. The code is cross-platform; to add macOS/Linux later, restore a
    # matrix with macos-latest (--target universal-apple-darwin) and ubuntu-22.04.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      # Signed updater artifacts use the TAURI_SIGNING_PRIVATE_KEY secret
      # (+ _PASSWORD if the key has one). Windows code signing is not set up yet.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Hello World v__VERSION__
          releaseBody: |
            **Hello World — a journal for new coders.** Log what you learned, practise it, and see your progress. Everything stays on your device.

            ### Install (Windows 10/11)
            1. Download **`Hello World_x.y.z_x64-setup.exe`** below (the `.msi` works too).
            2. Run it. Windows may show *"Windows protected your PC"* because the installer isn't code-signed yet. Click **More info → Run anyway**.
            3. Open **Hello World** from the Start menu.

            Your data is stored in `%APPDATA%\app.helloworld.journal`. The app checks this page for updates.
          releaseDraft: true
          includeUpdaterJson: true
