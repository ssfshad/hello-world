name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    # Windows first. The code is cross-platform; to add macOS/Linux later, restore a
    # matrix with macos-latest (--target universal-apple-darwin) and ubuntu-22.04.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # Signed updater artifacts. Add the TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD)
      # repository secrets. Configure Windows code signing before a public release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Hello World v__VERSION__
          releaseDraft: true
          includeUpdaterJson: true
